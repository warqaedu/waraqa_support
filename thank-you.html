<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شكرًا لك | ورقة</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050C16;--surface:#0A1626;--line:rgba(255,255,255,.09);--fg:#fff;--muted:#A7B5C9;--neon:#00D9FF;--neon-ink:#021018;--neon-glow:rgba(0,217,255,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:17px;line-height:1.8;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.card{position:relative;width:100%;max-width:560px;background:var(--surface);padding:48px 32px 40px;text-align:center;display:grid;gap:18px;justify-items:center;border-radius:6px 0 6px 6px;clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%);border:1px solid var(--line)}
.card::after{content:"";position:absolute;top:0;right:0;width:34px;height:34px;background:var(--neon);clip-path:polygon(0 0,0 100%,100% 100%)}
img{height:72px;width:auto;mix-blend-mode:lighten}
h1{font-family:'Alexandria','Segoe UI',Tahoma,sans-serif;font-size:clamp(26px,5vw,36px);margin:0;line-height:1.4;text-wrap:balance}
h1 span{color:var(--neon);text-shadow:0 0 24px var(--neon-glow)}
p{margin:0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Alexandria','Segoe UI',Tahoma,sans-serif;font-weight:600;font-size:16px;padding:14px 28px;border-radius:999px;text-decoration:none;background:var(--neon);color:var(--neon-ink);transition:transform .25s,box-shadow .25s;margin-top:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px var(--neon-glow)}
.btn:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
</style>
</head>
